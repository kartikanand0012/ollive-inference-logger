# One-shot jobs — the k8s twins of the compose migrate / kafka-init services.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "/migrations/migrate.sh"]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: ollive }
            - { name: PGPASSWORD, value: ollive }
            - { name: PGDATABASE, value: ollive }
          volumeMounts:
            - { name: migrations, mountPath: /migrations, readOnly: true }
      volumes:
        - name: migrations
          configMap: { name: migrations }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: ollive/kafka-init:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
