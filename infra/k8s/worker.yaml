apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1 # scale up to 6 (= partitions of inference.events); group rebalances
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 30 # finish in-flight batch + commit
      containers:
        - name: worker
          image: ollive/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
