# EXAMPLE ONLY — NOT applied by kustomize (would clobber real keys).
# The deploy scripts create the real 'provider-keys' secret imperatively:
#   kubectl -n ollive create secret generic provider-keys \
#     --from-literal=ANTHROPIC_API_KEY=... --from-literal=INGEST_KEY=dev-ingest-key
# Example only — put real keys in via `kubectl create secret` or a sealed secret.
apiVersion: v1
kind: Secret
metadata:
  name: provider-keys
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  INGEST_KEY: dev-ingest-key
