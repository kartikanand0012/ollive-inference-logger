apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1 # stateless — scale freely behind the Service (cancel map caveat in LLD §8)
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ollive/api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: provider-keys }
          env:
            - { name: API_PORT, value: "4000" }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 4000 } # deep: proves DB reachability
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 4000 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 4000
      nodePort: 30040
